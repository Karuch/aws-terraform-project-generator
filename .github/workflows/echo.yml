name: Terraform CI (Self-Hosted Terraform)

on:
  push:
    branches: [ "cicd" ]

# Tal — remember: OIDC later, no static creds!

jobs:
  fmt:
    name: Terraform Format Check
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.13.4
    steps:
      - uses: actions/checkout@v4
      - name: Terraform Format Check
        working-directory: check
        run: terraform fmt -check -recursive

  lint:
    name: Terraform Lint
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.13.4
    steps:
      - uses: actions/checkout@v4

      - name: Install TFLint
        run: |
          apk add --no-cache curl bash
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Run TFLint
        working-directory: check
        run: |
          tflint --init
          tflint

  plan:
    name: Terraform Plan
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.13.4
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init (no backend)
        working-directory: check
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: check
        run: terraform validate -no-color

      - name: Terraform Plan (local only)
        working-directory: check
        run: |
          terraform plan -input=false -lock=false -refresh=false -out=tfplan || true

      - name: Upload Terraform Plan (if exists)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: check/tfplan
          if-no-files-found: ignore

  checkov:
    name: Terraform Security Scan (Checkov)
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.13.4
    steps:
      - uses: actions/checkout@v4

      # ✅ Install Python and Checkov (fixes PEP 668 restriction)
      - name: Install Checkov
        run: |
          apk add --no-cache python3 py3-pip
          pip install --break-system-packages checkov

      - name: Run Checkov Scan
        working-directory: check
        run: |
          checkov -d . --framework terraform --compact --quiet \
          --output-file-path checkov_report.json || true

      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: check/checkov_report.json
          if-no-files-found: ignore