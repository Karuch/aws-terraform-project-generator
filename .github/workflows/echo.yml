name: Terraform CI (Self-Hosted Alpine)

on:
  push:
    branches: [ "cicd" ]


# need to OIDC tal rememebr don't be lame

jobs:
  terraform:
    runs-on: self-hosted
    container:
      image: alpine:3.20
    steps:
      - name: Install dependencies
        run: |
          ls
          echo "^^^^^"
          apk add --no-cache bash curl git openssl unzip
          # install Terraform
          TF_VERSION=1.9.8
          curl -fsSL https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip -o tf.zip
          unzip tf.zip && mv terraform /usr/local/bin/ && rm tf.zip
          terraform version
          # install TFLint
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --version

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TFLint
        working-directory: check
        run: |
          ls
          pwd
          tflint --init && tflint

      - name: Terraform Format Check
        working-directory: check
        run: terraform fmt -check -recursive

      - name: Terraform Init & Plan
        working-directory: check
        run: |
          terraform init -backend=false
          terraform validate
          terraform plan -out=tfplan
