name: Terraform CI (Self-Hosted Terraform)

on:
  push:
    branches: [ "cicd" ]

# Tal — remember: OIDC later, no static creds!

jobs:
  fmt:
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.13.4
    steps:
      - uses: actions/checkout@v4
      - name: Terraform Format Check
        working-directory: check
        run: terraform fmt -check -recursive

  lint:
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.13.4
    steps:
      - uses: actions/checkout@v4
      - name: Install TFLint
        run: |
          apk add --no-cache curl bash
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - name: Run TFLint
        working-directory: check
        run: |
          tflint --init
          tflint

  plan:
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.13.4
    steps:
      - uses: actions/checkout@v4

      - name: Terraform Init (no backend)
        working-directory: check
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: check
        run: terraform validate -no-color

      - name: Terraform Plan (local only)
        working-directory: check
        run: |
          terraform plan -input=false -lock=false -refresh=false -out=tfplan || true

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: check/tfplan

  checkov:
    needs: [fmt, lint, plan]
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.13.4
    steps:
      - uses: actions/checkout@v4

      - name: Install Checkov
        run: apk add --no-cache py3-checkov

      - name: Run Checkov Scan
        working-directory: check
        run: checkov -d . --framework terraform --compact --quiet

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov_report.json
        if: always()
